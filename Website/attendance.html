<!DOCTYPE html>
<html>
<head>
  <title>Attendance</title>
  <style>
    body { margin:0; font-family:Arial; display:flex; background:#f4f6f9; }

    /* Sidebar */
    .sidebar {
      width:220px; height:100vh; background:#2c3e50; color:white; padding:20px;
    }
    .sidebar h2{text-align:center; margin-bottom:30px;}
    .sidebar a{display:block;color:white;padding:10px;margin:10px 0;text-decoration:none;border-radius:5px;}
    .sidebar a:hover{background:#34495e;}

    /* Main */
    .main{flex:1;padding:20px;}
    .header{font-size:24px;margin-bottom:20px;}

    /* Filters */
    .filters{margin-bottom:15px;}
    input, select{padding:8px;margin-right:10px;border-radius:5px;border:1px solid #ccc;}
    button{padding:8px 12px;border:none;border-radius:5px;background-color:#3498db;color:white;cursor:pointer;}
    button:hover{background-color:#2980b9;}

    /* Table */
    table{width:100%; border-collapse:collapse; background:white; border-radius:10px; overflow:hidden;}
    th, td{padding:12px;text-align:center;border-bottom:1px solid #ddd;}
    th{background-color:#2ecc71;color:white;}
    tr:hover{background-color:#f1f1f1;}
    .present{color:green; font-weight:bold;}
    .absent{color:red; font-weight:bold;}

    /* Camera */
    .camera-box{margin-bottom:20px;background:white;padding:20px;border-radius:10px;text-align:center;}
    video{border-radius:10px; border:2px solid #ccc;}

  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Face System</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="students.html">Students</a>
  <a href="attendance.html">Attendance</a>
  <a href="#">Courses</a>
  <a href="login.html">Logout</a>
</div>

<!-- Main -->
<div class="main">
  <div class="header">Attendance Records 📋</div>

  <!-- Camera -->
  <div class="camera-box">
    <h3>Face Recognition</h3>
    <video id="video" width="320" height="240" autoplay muted></video>
    <div id="status">Initializing camera...</div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <input type="date" id="dateFilter">
    <select id="statusFilter">
      <option value="">All</option>
      <option value="Present">Present</option>
      <option value="Absent">Absent</option>
    </select>
    <button onclick="filterTable()">Filter</button>
  </div>

  <!-- Table -->
  <table id="attendanceTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Rama</td>
        <td>2026-03-23</td>
        <td>10:00 AM</td>
        <td class="absent">Absent</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Ahmad</td>
        <td>2026-03-23</td>
        <td>10:05 AM</td>
        <td class="absent">Absent</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
// Camera setup
const video = document.getElementById("video");
navigator.mediaDevices.getUserMedia({video:true})
  .then(stream => {
    video.srcObject = stream;
    document.getElementById("status").innerText = "Camera Ready";
    // Start fake recognition for demo
    simulateRecognition();
  })
  .catch(err => document.getElementById("status").innerText="Camera Error");

// Fake recognition function (replace with your model later)
function simulateRecognition() {
  // كل 5 ثواني يضيف حالة Present للطالب الأول اللي Absent
  setInterval(() => {
    const rows = document.querySelectorAll("#attendanceTable tbody tr");
    for (let row of rows) {
      if(row.cells[4].innerText === "Absent") {
        row.cells[4].innerText = "Present";
        row.cells[4].className = "present";

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,"0") + ":" +
                        now.getMinutes().toString().padStart(2,"0");
        row.cells[3].innerText = timeStr;

        const dateStr = now.getFullYear()+"-"+(now.getMonth()+1).toString().padStart(2,"0")+
                        "-"+now.getDate().toString().padStart(2,"0");
        row.cells[2].innerText = dateStr;

        document.getElementById("status").innerText = row.cells[1].innerText + " is Present";
        break; // واحد بالوقت نفسه
      }
    }
  }, 5000);
}

// Filter function
function filterTable() {
  let date = document.getElementById("dateFilter").value;
  let status = document.getElementById("statusFilter").value;

  let rows = document.querySelectorAll("#attendanceTable tbody tr");
  rows.forEach(row => {
    let rowDate = row.cells[2].innerText;
    let rowStatus = row.cells[4].innerText;
    let show = true;
    if(date && rowDate !== date) show = false;
    if(status && rowStatus !== status) show = false;
    row.style.display = show ? "" : "none";
  });
}
</script>

</body>
</html>
