<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      background-color: #f4f6f9;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      height: 100vh;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 10px;
      margin: 10px 0;
      text-decoration: none;
      border-radius: 5px;
    }

    .sidebar a:hover {
      background-color: #34495e;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 20px;
    }

    .header {
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* Cards */
    .cards {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      padding: 20px;
      border-radius: 10px;
      color: white;
      text-align: center;
      font-size: 18px;
    }

    .green { background-color: #4CAF50; }
    .red { background-color: #f44336; }
    .blue { background-color: #3498db; }

    /* Camera */
    .camera-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    video {
      border-radius: 10px;
      border: 2px solid #ccc;
    }

    #status {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
    }

  </style>
</head>

<body>

<div class="sidebar">
  <h2>Face System</h2>

  <a href="dashboard.html">Dashboard</a>
  <a href="students.html">Students</a>
  <a href="attendance.html">Attendance</a>
  <a href="#">Courses</a>
  <a href="login.html">Logout</a>
</div>
<!-- Main Content -->
<div class="main">

  <div class="header">Welcome Dr. Rama 👩‍🏫</div>

  <!-- Stats -->
  <div class="cards">
    <div class="card green">Present: 25</div>
    <div class="card red">Absent: 5</div>
    <div class="card blue">Total: 30</div>
  </div>

  <!-- Camera -->
  <div class="camera-box">
    <h3>Face Recognition</h3>

    <!-- هون حطي الكاميرا تبعتك -->
    <video id="video" width="320" height="240" autoplay muted></video>

    <div id="status">Waiting...</div>
  </div>

</div>

<script>
// تشغيل الكاميرا
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => video.srcObject = stream);
</script>

</body>
</html>
