<!DOCTYPE html>
<html>
<head>
  <title>Face Attendance Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #container-video { position: relative; display: inline-block; margin-top: 20px; }
    #video { border: 2px solid #333; border-radius: 8px; }
    #overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
    #display { margin-top: 10px; font-size: 1.5em; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>Attendance Dashboard</h1>
  <div id="container-video">
    <video id="video" width="320" height="240" autoplay muted></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>
  <h2 id="display">Waiting...</h2>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const display = document.getElementById("display");

// فتح الكاميرا
navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
  .then(stream => video.srcObject = stream);

// رسم الفيديو مستمر على Canvas
function drawVideo() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  requestAnimationFrame(drawVideo);
}
drawVideo();

// إرسال Frame تلقائي كل ثانيتين للتحقق من الحضور
async function checkAttendance() {
  try {
    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = 320;
    tempCanvas.height = 240;
    const tempCtx = tempCanvas.getContext("2d");
    tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);

    tempCanvas.toBlob(async (blob) => {
      try {
        const res = await fetch("http://localhost:3000/recognize", { method: "POST", body: blob });
        const data = await res.json();

        const boxWidth = 100;
        const boxHeight = 100;
        const x = data.x || (canvas.width - boxWidth)/2;
        const y = data.y || (canvas.height - boxHeight)/2;

        // ارسم المربع فقط
        ctx.lineWidth = 3;
        ctx.strokeStyle = data.found ? "green" : "red";
        ctx.strokeRect(x, y, boxWidth, boxHeight);

        // تحديث display فقط إذا data.found موجود
        if (data.found !== undefined) {
          display.innerText = data.found ? "Present ✅" : "Not recognized ❌";
        } else {
          display.innerText = "Waiting...";
        }

      } catch(err) {
        console.log(err);
        display.innerText = "Waiting...";
      }
    }, "image/jpeg", 0.5);
  } catch(err) {
    console.log(err);
  }
}

// كل ثانيتين يفحص تلقائي
setInterval(checkAttendance, 2000);
</script>

</body>
</html>
