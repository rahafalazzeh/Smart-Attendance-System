<!DOCTYPE html>
<html>
<head>
  <title>Students</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      display: flex;
      background-color: #f4f6f9;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      height: 100vh;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: white;
      padding: 10px;
      margin: 10px 0;
      text-decoration: none;
      border-radius: 5px;
    }

    .sidebar a:hover {
      background-color: #34495e;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 20px;
    }

    .header {
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* Button */
    .add-btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .add-btn:hover {
      background-color: #45a049;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #3498db;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    /* Buttons */
    .edit-btn {
      background-color: #f39c12;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .modal-content {
      background: white;
      padding: 20px;
      width: 300px;
      margin: 10% auto;
      border-radius: 10px;
      text-align: center;
    }

    .modal input, .modal select {
      width: 90%;
      padding: 8px;
      margin: 10px 0;
    }

    .modal button {
      padding: 8px 12px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .save-btn {
      background-color: #4CAF50;
      color: white;
    }

    .cancel-btn {
      background-color: #e74c3c;
      color: white;
    }

  </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>Face System</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="#">Students</a>
  <a href="#">Attendance</a>
  <a href="#">Courses</a>
  <a href="#">Logout</a>
</div>

<!-- Main -->
<div class="main">

  <div class="header">Manage Students 👩‍🎓</div>

  <button class="add-btn" onclick="addStudent()">+ Add Student</button>

  <table id="studentTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>1</td>
        <td>Rama</td>
        <td>Present</td>
        <td>
          <button class="edit-btn" onclick="openEditModal(this)">Edit</button>
          <button class="delete-btn" onclick="deleteRow(this)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>

<!-- Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Student</h3>

    <input type="text" id="editName" placeholder="Student Name">
    
    <select id="editStatus">
      <option>Present</option>
      <option>Absent</option>
    </select>

    <br>
    <button class="save-btn" onclick="saveEdit()">Save</button>
    <button class="cancel-btn" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>

let currentRow = null;

// إضافة طالب
function addStudent() {
  let name = prompt("Enter student name:");
  if(!name) return;

  let table = document.getElementById("studentTable").getElementsByTagName('tbody')[0];
  let newRow = table.insertRow();

  let id = table.rows.length;

  newRow.innerHTML = `
    <td>${id}</td>
    <td>${name}</td>
    <td>Absent</td>
    <td>
      <button class="edit-btn" onclick="openEditModal(this)">Edit</button>
      <button class="delete-btn" onclick="deleteRow(this)">Delete</button>
    </td>
  `;
}

// حذف
function deleteRow(btn) {
  let row = btn.parentNode.parentNode;
  row.remove();
}

// فتح المودال
function openEditModal(btn) {
  currentRow = btn.parentNode.parentNode;

  document.getElementById("editName").value = currentRow.cells[1].innerText;
  document.getElementById("editStatus").value = currentRow.cells[2].innerText;

  document.getElementById("editModal").style.display = "block";
}

// حفظ التعديل
function saveEdit() {
  const newName = document.getElementById("editName").value;
  const newStatus = document.getElementById("editStatus").value;

  currentRow.cells[1].innerText = newName;
  currentRow.cells[2].innerText = newStatus;

  closeModal();
}

// إغلاق
function closeModal() {
  document.getElementById("editModal").style.display = "none";
}

</script>

</body>
</html>
